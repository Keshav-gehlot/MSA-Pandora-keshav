# Deploys both apps to Vercel from GitHub Actions.
# Vercel's own GitHub integration needs a paid plan for private organization repos, so instead
# we build here and upload the prebuilt output with the Vercel CLI (allowed on the Hobby plan).
# Pull requests get preview deployments with a short, stable alias (commented on the PR);
# merges to main go to production. Every deploy is recorded as a GitHub deployment, so it shows
# in the repo's Deployments panel and on the pull request.
name: deploy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" button in the Actions tab: deploys both apps to production
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  deployments: write
  pull-requests: write
env:
  VERCEL_ORG_ID: team_ctPt2EEwbsf2qlZbCgsCZdPL
jobs:
  # Decide which apps this change affects, so unaffected apps don't deploy at all.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      apps: ${{ steps.affected.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # An app deploys when: run by hand, this workflow file changed, or turbo-ignore says something
      # the app depends on changed since BASE (turbo-ignore exits 0 when nothing did).
      - name: Find affected apps
        id: affected
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          force=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ -z "$BASE" ] \
            || git diff --name-only "$BASE" HEAD 2>/dev/null | grep -qx '.github/workflows/deploy.yml'; then
            force=true
          fi
          apps=()
          for entry in "web:prj_BMnZe3rs4aSPKr0TOljEIIVuz8DB:pandora" "console:prj_dApHhJkfMFiBhCTf8yvRTkAsYASE:pandora-console"; do
            IFS=: read -r app project_id alias_prefix <<< "$entry"
            if [ "$force" = true ] || ! npx --yes turbo-ignore "@pandora/$app" --fallback="$BASE" > /dev/null 2>&1; then
              apps+=("{\"app\":\"$app\",\"project_id\":\"$project_id\",\"alias_prefix\":\"$alias_prefix\"}")
              echo "### $app: deploying" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "### $app: skipped (no changes affect it)" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "apps=[$(IFS=,; echo "${apps[*]}")]" >> "$GITHUB_OUTPUT"

  deploy:
    needs: plan
    if: needs.plan.outputs.apps != '[]'
    name: deploy (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.apps) }}
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}-${{ matrix.app }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_PROJECT_ID: ${{ matrix.project_id }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TARGET: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      PROD_FLAG: ${{ github.event_name == 'pull_request' && '' || '--prod' }}
    steps:
      - name: Require the VERCEL_TOKEN secret
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Add a repository secret named VERCEL_TOKEN (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Pull Vercel project settings
        run: npx --yes vercel@latest pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN"
      - name: Build
        run: npx --yes vercel@latest build $PROD_FLAG --token="$VERCEL_TOKEN"
      - name: Deploy
        id: deploy
        env:
          ALIAS: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}.vercel.app', matrix.alias_prefix, github.event.pull_request.number) || '' }}
        run: |
          url=$(npx --yes vercel@latest deploy --prebuilt $PROD_FLAG --token="$VERCEL_TOKEN")
          if [ -n "$ALIAS" ]; then
            npx --yes vercel@latest alias set "$url" "$ALIAS" --token="$VERCEL_TOKEN" > /dev/null
            url="https://$ALIAS"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### ${{ matrix.app }} ($TARGET): $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Comment the preview link on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker="<!-- pandora-preview:${{ matrix.app }} -->"
          body="$marker
          **Preview (${{ matrix.app }}):** $URL"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi
